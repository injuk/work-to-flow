openapi: 3.0.0
info:
  version: '0.1'
  title: Work-to-Flow
  description: |
    Work-to-Flow(이하 WTF) API.
    DAM(Digital Asset Management)에 Jira Automation 형태의 워크플로우 자동화 기능을 도입하기 위한 PoC API 명세이다.
    모든 엔드포인트는 `projectId` 헤더를 필수로 요구하며, 응답의 시간 표현은 ISO 8601(`date-time`) 문자열로 통일한다.
  termsOfService: 'https://cloudplex.megazone.io/private_policy.html'
  contact:
    name: PBU DAM Team
    url: pdc.cag.ca1@mz.co.kr
    email: pdc.cag.ca1@mz.co.kr
  license:
    url: 'https://www.megazone.com/'
    name: MegazoneCloud
servers:
  - url: 'http://localhost:3000'
paths:
  /workflows:
    post:
      tags:
        - workflows
      summary: Workflow 신규 생성
      description: |
        새로운 Workflow를 생성한다.
        생성 직후의 Workflow는 `DRAFT` 상태이며, `stepTree`가 갖춰지고 수정 API를 통해 `ACTIVE`/`INACTIVE`로 전이될 수 있다.
      operationId: createWorkflow
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        $ref: '#/components/requestBodies/CreateWorkflow'
      responses:
        '201':
          $ref: '#/components/responses/CreateWorkflow'
      servers:
        - url: 'http://localhost:3000'
    get:
      tags:
        - workflows
      summary: Workflow 목록 조회
      description: |
        Workflow의 목록을 조회한다.
        항상 `created.at` 기준 내림차순으로 정렬되며, `nextToken`을 통해 페이지네이션을 지원한다.
      operationId: listWorkflows
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/nextToken'
        - $ref: '#/components/parameters/limit'
        - name: status
          in: query
          description: Workflow 상태를 기준으로 검색
          required: false
          schema:
            $ref: '#/components/schemas/WorkflowStatus'
      responses:
        '200':
          $ref: '#/components/responses/ListWorkflows'
      servers:
        - url: 'http://localhost:3000'
  '/workflows/{workflowId}':
    get:
      tags:
        - workflows
      summary: Workflow 상세 조회
      description: |
        Workflow의 상세 정보를 조회한다.
        응답에는 Step 트리(`stepTree`) 전체가 포함되므로, 목록 조회보다 무거운 응답을 반환할 수 있다.
      operationId: getWorkflow
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetWorkflow'
      servers:
        - url: 'http://localhost:3000'
    patch:
      tags:
        - workflows
      summary: Workflow 수정
      description: |
        Workflow의 메타 정보(`name`, `description`)와 상태(`status`)를 수정한다.
        `DRAFT` -> `ACTIVE` 또는 `INACTIVE`로의 전이는 `stepTree`가 온전히 구성되어 있을 때에만 허용된다.
        초기 상태인 `DRAFT`로의 역방향 전이는 허용하지 않는다.
      operationId: updateWorkflow
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UpdateWorkflow'
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
    delete:
      tags:
        - workflows
      summary: Workflow 삭제
      description: Workflow를 삭제한다.
      operationId: deleteWorkflow
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
  '/workflows/{workflowId}/steps':
    put:
      tags:
        - workflows
      summary: Workflow Step 트리 덮어쓰기
      description: |
        Workflow에 묶인 Step 트리를 통째로 덮어쓴다.
        부분 수정은 지원하지 않으며, 기존에 연결된 모든 `WorkflowStep`을 제거한 뒤 요청 본문의 트리로 재생성한다.
        가장 깊은 흐름의 깊이가 20을 초과하면 거부된다.
        초기 구현에서는 트리 무결성(`stepTree`의 형태/연결 관계)이 항상 옳다고 가정하지만,
        추후 검증 로직이 별도 모듈로 분리되어 추가될 예정이다.
      operationId: putWorkflowSteps
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/PutWorkflowSteps'
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
  /workflow-step-schemas:
    get:
      tags:
        - workflow-step-schemas
      summary: Workflow Step Schema 목록 조회
      description: |
        선택 가능한 Step Schema(스텝의 카탈로그)를 조회한다.
        항상 `id` 기준 오름차순으로 정렬되며, 다음과 같은 흐름으로 트리를 순회할 수 있다:
          1. 최초에는 `?type=TRIGGER`로 호출하여 사용자가 선택할 수 있는 첫 Step 후보를 모두 조회한다.
          2. 사용자가 Step 하나를 선택하면, 해당 Schema의 `id`를 `?frontSchemaId=`에 넣어 호출한다.
             이를 통해 해당 Schema에 이어 붙일 수 있는 후속 Schema 목록을 알 수 있다.
          3. `END` 타입의 Schema가 등장하면, 더 이상 이어 붙일 수 있는 Schema가 없는 종단 노드이다.
        `START`/`END` 타입은 항상 `isHidden=true`로 사용자에게 노출되지 않으며,
        오로지 백엔드 내부의 Schema 그래프 시작/종단을 표현하기 위해서만 존재한다.
      operationId: listWorkflowStepSchemas
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/nextToken'
        - $ref: '#/components/parameters/limit'
        - name: type
          in: query
          description: Step Schema 유형을 기준으로 검색
          required: false
          schema:
            $ref: '#/components/schemas/WorkflowStepSchemaType'
        - name: frontSchemaId
          in: query
          description: |
            특정 Step Schema 뒤에 이어 붙일 수 있는 후속 Schema를 조회할 때 사용한다.
            전달된 식별자에 해당하는 Schema의 `RearSchemaId`를 따라 조회된다.
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ListWorkflowStepSchemas'
      servers:
        - url: 'http://localhost:3000'
  '/workflows/{workflowId}/executions':
    get:
      tags:
        - workflow-executions
      summary: Workflow Execution 목록 조회
      description: |
        특정 Workflow의 실행(`WorkflowExecution`) 목록을 조회한다.
        `WorkflowExecution`의 `id`는 UUID v7이므로 생성일자가 정렬에 반영된다 — 따라서 항상 `id` 기준 내림차순으로 정렬된다.
        `statuses` 쿼리는 쉼표로 구분된 다중 상태(예: `RUNNING,PARTIAL_FAILED`)를 받는다.
      operationId: listWorkflowExecutions
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/nextToken'
        - $ref: '#/components/parameters/limit'
        - name: statuses
          in: query
          description: |
            Workflow Execution 상태를 기준으로 검색.
            여러 상태를 동시에 조회하려면 쉼표로 구분(예: `RUNNING,PARTIAL_FAILED`).
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkflowExecutionStatus'
      responses:
        '200':
          $ref: '#/components/responses/ListWorkflowExecutions'
      servers:
        - url: 'http://localhost:3000'
  '/workflows/{workflowId}/executions/{executionId}':
    get:
      tags:
        - workflow-executions
      summary: Workflow Execution 상세 조회
      description: |
        Workflow Execution의 상세 정보를 조회한다.
        응답에는 Step 실행 트리(`stepExecutionTree`)와 집계 요약(`summary`)이 포함된다.
      operationId: getWorkflowExecution
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
        - name: executionId
          in: path
          description: Workflow Execution 식별자(UUID v7)
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GetWorkflowExecution'
      servers:
        - url: 'http://localhost:3000'
    delete:
      tags:
        - workflow-executions
      summary: Workflow Execution 삭제
      description: |
        Workflow Execution을 삭제한다.
        실제 운영에서 해당 동작이 필요한지에 대해서는 추가 논의가 필요하며, PoC 단계에서만 잠정적으로 제공한다.
      operationId: deleteWorkflowExecution
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: workflowId
          in: path
          description: Workflow 식별자
          required: true
          schema:
            type: string
        - name: executionId
          in: path
          description: Workflow Execution 식별자(UUID v7)
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
tags:
  - name: workflows
    description: Workflow의 정의와 Step 트리 관리를 위한 API
  - name: workflow-step-schemas
    description: Step Schema(스텝 카탈로그) 조회를 위한 API
  - name: workflow-executions
    description: Workflow의 실행 결과(Execution) 조회/관리를 위한 API
components:
  parameters:
    projectId:
      name: projectId
      in: header
      required: true
      schema:
        type: string
      description: |
        요청을 수행하는 Project의 식별자.
        PoC 단계에서는 인증이 도입되지 않았으므로, 호출자가 헤더로 직접 전달한다.
    nextToken:
      name: nextToken
      in: query
      description: '다음 목록이 존재하는 경우, 이를 조회하기 위한 토큰 정보'
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: 목록 조회시 반환될 항목의 최대 개수
      required: false
      schema:
        type: integer
        format: int32
  requestBodies:
    CreateWorkflow:
      description: Workflow 신규 생성 요청
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Workflow 이름
              description:
                type: string
                nullable: true
                description: Workflow 설명. 없으면 `null` 또는 생략한다.
            required:
              - name
    UpdateWorkflow:
      description: |
        Workflow 수정 요청.
        `status`는 `ACTIVE`/`INACTIVE`만 허용되며, 초기 상태인 `DRAFT`로의 역방향 전이는 허용하지 않는다.
        최소 1개 이상의 필드가 전달되어야 한다.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Workflow 이름
              description:
                type: string
                nullable: true
                description: Workflow 설명. `null`을 전달하면 설명을 비울 수 있다.
              status:
                type: string
                description: |
                  Workflow 상태.
                  `DRAFT` -> `ACTIVE`/`INACTIVE` 전이는 `stepTree`가 온전한 경우에만 가능하다.
                enum:
                  - ACTIVE
                  - INACTIVE
            minProperties: 1
    PutWorkflowSteps:
      description: |
        Workflow의 Step 트리 덮어쓰기 요청.
        기존 트리는 모두 제거되며, 본문에 명시된 트리로 재구성된다.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              stepTree:
                $ref: '#/components/schemas/RequestedStep'
            required:
              - stepTree
  responses:
    CreateWorkflow:
      description: Workflow 신규 생성 응답
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: 생성된 Workflow의 식별자(hashid 인코딩 결과)
            required:
              - id
    ListWorkflows:
      description: Workflow 목록 조회 응답
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
              nextToken:
                type: string
                nullable: true
                description: '다음 목록이 존재하는 경우, 이를 조회하기 위한 토큰 정보'
            required:
              - results
              - nextToken
    GetWorkflow:
      description: Workflow 상세 조회 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workflow'
    ListWorkflowStepSchemas:
      description: Workflow Step Schema 목록 조회 응답
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowStepSchema'
              nextToken:
                type: string
                nullable: true
                description: '다음 목록이 존재하는 경우, 이를 조회하기 위한 토큰 정보'
            required:
              - results
              - nextToken
    ListWorkflowExecutions:
      description: Workflow Execution 목록 조회 응답
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowExecutionSummary'
              nextToken:
                type: string
                nullable: true
                description: '다음 목록이 존재하는 경우, 이를 조회하기 위한 토큰 정보'
            required:
              - results
              - nextToken
    GetWorkflowExecution:
      description: Workflow Execution 상세 조회 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowExecution'
  schemas:
    Project:
      type: object
      title: Project
      description: Project의 식별 정보
      properties:
        id:
          type: string
          description: Project 식별자
      required:
        - id
    By:
      type: object
      title: By
      description: 행위 주체에 대한 식별 정보
      properties:
        id:
          type: string
          description: 사용자 식별자
        name:
          type: string
          description: 사용자 표시 이름
        username:
          type: string
          description: 사용자 로그인/계정명
      required:
        - id
        - name
        - username
    Actioned:
      type: object
      title: Actioned
      description: 행위가 발생한 시점과 주체에 대한 정보
      properties:
        at:
          type: string
          format: date-time
          description: 행위 발생 시점(ISO 8601)
        by:
          $ref: '#/components/schemas/By'
      required:
        - at
        - by
    SimpleActioned:
      type: object
      title: SimpleActioned
      description: 행위 주체 정보 없이 시점만 보존하는 단순 형태의 Actioned
      properties:
        at:
          type: string
          format: date-time
          description: 행위 발생 시점(ISO 8601)
      required:
        - at
    WorkflowStatus:
      type: string
      title: WorkflowStatus
      description: |
        Workflow의 상태.
        - `DRAFT`: 초기 상태. `stepTree`가 채워지지 않았거나 검증 중인 단계.
        - `ACTIVE`: 트리거가 발생하면 실행되는 활성 상태.
        - `INACTIVE`: 정의는 유지하되, 트리거가 발생해도 실행되지 않는 비활성 상태.
      enum:
        - INACTIVE
        - ACTIVE
        - DRAFT
    WorkflowSummary:
      type: object
      title: WorkflowSummary
      description: |
        Workflow 목록 조회시 반환되는 요약 정보.
        `description`과 `stepTree`처럼 무거운 필드는 포함되지 않는다.
      properties:
        id:
          type: string
          description: Workflow 식별자(hashid 인코딩 결과)
        project:
          $ref: '#/components/schemas/Project'
        name:
          type: string
          description: Workflow 이름
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        created:
          $ref: '#/components/schemas/Actioned'
        updated:
          $ref: '#/components/schemas/SimpleActioned'
      required:
        - id
        - project
        - name
        - status
        - created
        - updated
    Workflow:
      type: object
      title: Workflow
      description: Workflow의 상세 정보. `stepTree`를 통해 전체 Step 트리를 함께 반환한다.
      properties:
        id:
          type: string
          description: Workflow 식별자(hashid 인코딩 결과)
        project:
          $ref: '#/components/schemas/Project'
        name:
          type: string
          description: Workflow 이름
        description:
          type: string
          nullable: true
          description: Workflow 설명
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        stepTree:
          $ref: '#/components/schemas/WorkflowStep'
        created:
          $ref: '#/components/schemas/Actioned'
        updated:
          $ref: '#/components/schemas/SimpleActioned'
      required:
        - id
        - project
        - name
        - description
        - status
        - stepTree
        - created
        - updated
    WorkflowStepSchemaType:
      type: string
      title: WorkflowStepSchemaType
      description: |
        Step Schema의 유형.
        - `START`/`END`: 항상 `isHidden=true`로 사용자에게 노출되지 않는, Schema 그래프의 시작/종단 노드.
        - `TRIGGER`: 사용자가 Workflow의 첫 Step으로 선택할 수 있는 트리거 유형.
        - `CHOICE`: 분기 선택지를 제공하는 Step.
        - `SYNC_TASK`: 동기적으로 처리되는 작업 Step.
        - `ASYNC_TASK`: 비동기적으로 처리되는 작업 Step.
      enum:
        - START
        - TRIGGER
        - CHOICE
        - SYNC_TASK
        - ASYNC_TASK
        - END
    WorkflowStepSchema:
      type: object
      title: WorkflowStepSchema
      description: 사용자가 Workflow를 구성할 때 선택할 수 있는 Step의 카탈로그(템플릿) 정보
      properties:
        id:
          type: string
          description: Step Schema 식별자(hashid 인코딩 결과)
        name:
          type: string
          description: Step Schema 이름
        type:
          $ref: '#/components/schemas/WorkflowStepSchemaType'
        condition:
          type: object
          additionalProperties: true
          description: |
            해당 Schema에서 선택/입력 가능한 항목을 정의하는 JSON Schema(json-schema validator 문법).
            예: `CHOICE`라면 어떤 선택지를 고를 수 있는지를 표현한다.
            검증할 것이 없는 경우에는 빈 객체(`{}`)가 저장된다.
        isHidden:
          type: boolean
          description: |
            UI 상에서 보여지지 않아야 하는 Schema 여부.
            `START`/`END` 타입은 언제나 `true`이다.
      required:
        - id
        - name
        - type
        - condition
        - isHidden
    WorkflowStepSchemaSummary:
      type: object
      title: WorkflowStepSchemaSummary
      description: WorkflowStep/WorkflowStepExecution이 참조하는 Schema의 요약 정보
      properties:
        id:
          type: string
          description: Step Schema 식별자(hashid 인코딩 결과)
        name:
          type: string
          description: Step Schema 이름
        type:
          $ref: '#/components/schemas/WorkflowStepSchemaType'
        isHidden:
          type: boolean
          description: UI 상에서 보여지지 않아야 하는 Schema 여부
      required:
        - id
        - name
        - type
        - isHidden
    WorkflowStep:
      type: object
      title: WorkflowStep
      description: |
        Workflow에 묶인 Step의 인스턴스. 자식 Step 배열을 가진 재귀 구조이다.
        실제 사용자에게 보여지는 트리는 `isHidden=false`인 Step들로 구성된다.
      properties:
        id:
          type: string
          description: WorkflowStep 식별자(varchar(24), CUID 형태이므로 별도 인코딩 없이 그대로 사용)
        schema:
          $ref: '#/components/schemas/WorkflowStepSchemaSummary'
        condition:
          type: object
          additionalProperties: true
          description: |
            참조하는 Schema의 `condition`(json-schema)에 부합하는 사용자 입력값.
            Schema의 종류에 따라 형태가 달라진다.
        children:
          type: array
          description: 후속 Step 목록(재귀)
          items:
            $ref: '#/components/schemas/WorkflowStep'
      required:
        - id
        - schema
        - condition
        - children
    RequestedStep:
      type: object
      title: RequestedStep
      description: |
        Workflow Step 트리 덮어쓰기 요청에서 사용되는 Step 정의.
        서버는 이 트리를 기반으로 새 `WorkflowStep`을 생성한다.
        가장 깊은 흐름의 깊이가 20을 초과하면 거부된다.
      properties:
        schemaId:
          type: string
          description: 참조할 Step Schema 식별자(hashid 인코딩 결과)
        condition:
          type: object
          additionalProperties: true
          description: 참조하는 Schema의 `condition`(json-schema)에 부합하는 사용자 입력값
        children:
          type: array
          description: 후속 Step 정의 목록(재귀)
          items:
            $ref: '#/components/schemas/RequestedStep'
      required:
        - schemaId
        - condition
        - children
    WorkflowStepExecutionStatus:
      type: string
      title: WorkflowStepExecutionStatus
      description: |
        WorkflowStep 단위 실행 상태.
        - `READY`: 실행 대기 상태.
        - `RUNNING`: 실행 중.
        - `SUSPENDED`: 일시 중지(실행 엔진에 의해서만 전이되며, 외부에서 명시적으로 전이시킬 수 없음).
        - `CANCELED`: 취소(취소 API는 PoC 단계에서 제공하지 않음).
        - `FAILED`: 실패.
        - `COMPLETED`: 정상 완료.
        - `SKIPPED`: 분기/조건에 의해 건너뜀.
      enum:
        - READY
        - RUNNING
        - SUSPENDED
        - CANCELED
        - FAILED
        - COMPLETED
        - SKIPPED
    WorkflowExecutionStatus:
      type: string
      title: WorkflowExecutionStatus
      description: |
        WorkflowExecution(전체 실행) 단위 상태.
        - `RUNNING`: 실행 중.
        - `PARTIAL_FAILED`: 일부 Step이 실패한 상태로 종료.
        - `FAILED`: 실패.
        - `COMPLETED`: 정상 완료.
        - `CANCELED`: 취소(취소 API는 PoC 단계에서 제공하지 않음).
        - `EXPIRED`: 만료.
      enum:
        - RUNNING
        - PARTIAL_FAILED
        - FAILED
        - COMPLETED
        - CANCELED
        - EXPIRED
    WorkflowStepExecution:
      type: object
      title: WorkflowStepExecution
      description: |
        WorkflowStep 단위 실행 결과. 자식 실행 배열을 가진 재귀 구조이다.
        실행 자체는 백엔드에서 자동으로 생성/전이되므로, 별도 생성/수정 API를 제공하지 않는다.
      properties:
        id:
          type: string
          description: WorkflowStepExecution 식별자(hashid 인코딩 결과)
        schema:
          $ref: '#/components/schemas/WorkflowStepSchemaSummary'
        status:
          $ref: '#/components/schemas/WorkflowStepExecutionStatus'
        children:
          type: array
          description: 후속 Step 실행 목록(재귀)
          items:
            $ref: '#/components/schemas/WorkflowStepExecution'
        started:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Step 실행이 시작된 시점. 아직 시작되지 않았다면 `null`.
        updated:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Step 실행이 마지막으로 갱신된 시점. 갱신 이력이 없다면 `null`.
        ended:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Step 실행이 종료된 시점. 종료되지 않았다면 `null`.
      required:
        - id
        - schema
        - status
        - children
        - started
        - updated
        - ended
    WorkflowExecutionSummary:
      type: object
      title: WorkflowExecutionSummary
      description: |
        WorkflowExecution 목록 조회시 반환되는 요약 정보.
        집계 카운트(`summary`)와 Step 실행 트리(`stepExecutionTree`)는 포함되지 않는다.
      properties:
        id:
          type: string
          description: WorkflowExecution 식별자(UUID v7)
        workflow:
          type: object
          description: Execution이 속한 Workflow 식별 정보
          properties:
            id:
              type: string
              description: Workflow 식별자(hashid 인코딩 결과)
          required:
            - id
        status:
          $ref: '#/components/schemas/WorkflowExecutionStatus'
        started:
          $ref: '#/components/schemas/SimpleActioned'
        updated:
          $ref: '#/components/schemas/SimpleActioned'
        canceled:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Execution이 취소된 시점. 취소되지 않았다면 `null`.
        ended:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Execution이 종료된 시점. 종료되지 않았다면 `null`.
      required:
        - id
        - workflow
        - status
        - started
        - updated
        - canceled
        - ended
    WorkflowExecution:
      type: object
      title: WorkflowExecution
      description: |
        WorkflowExecution의 상세 정보.
        TRIGGER에 의해 자동 실행되므로 생성 API는 제공되지 않으며,
        취소(`CANCELED`) 상태로의 명시적 전이도 PoC 단계에서는 제공하지 않는다.
      properties:
        id:
          type: string
          description: WorkflowExecution 식별자(UUID v7)
        workflow:
          type: object
          description: Execution이 속한 Workflow 식별 정보
          properties:
            id:
              type: string
              description: Workflow 식별자(hashid 인코딩 결과)
          required:
            - id
        status:
          $ref: '#/components/schemas/WorkflowExecutionStatus'
        summary:
          type: object
          description: Step 실행 결과의 집계 카운트
          properties:
            totalStepCount:
              type: integer
              format: int32
              description: 전체 Step 개수
            successCount:
              type: integer
              format: int32
              description: 성공한 Step 개수
            canceledCount:
              type: integer
              format: int32
              description: 취소된 Step 개수
            skippedCount:
              type: integer
              format: int32
              description: 건너뛴 Step 개수
            failureCount:
              type: integer
              format: int32
              description: 실패한 Step 개수
          required:
            - totalStepCount
            - successCount
            - canceledCount
            - skippedCount
            - failureCount
        stepExecutionTree:
          $ref: '#/components/schemas/WorkflowStepExecution'
        started:
          $ref: '#/components/schemas/SimpleActioned'
        updated:
          $ref: '#/components/schemas/SimpleActioned'
        canceled:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Execution이 취소된 시점. 취소되지 않았다면 `null`.
        ended:
          allOf:
            - $ref: '#/components/schemas/SimpleActioned'
          nullable: true
          description: Execution이 종료된 시점. 종료되지 않았다면 `null`.
      required:
        - id
        - workflow
        - status
        - summary
        - stepExecutionTree
        - started
        - updated
        - canceled
        - ended